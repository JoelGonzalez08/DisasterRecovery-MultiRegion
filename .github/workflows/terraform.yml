name: 'Terraform CI/CD - Infraestructura DR'

on:
  push:
    branches: [ "main", "region2" ]
  pull_request:
    branches: [ "main" ]

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: "us-east-1"
  TERRAFORM_VERSION: "1.10.5"

jobs:
  validate:
    name: 'Terraform Format & Static Validation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Verificar Formato (Recursivo)
        run: terraform fmt -check -recursive ./terraform

      - name: Validar Fase 1 - Primary (us-east-1)
        working-directory: ./terraform/environments/primary_us_east_1
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validar Fase 2 - Secondary Warm Standby (us-west-2)
        working-directory: ./terraform/environments/secondary_us_west_2
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validar Fase 3 - Global (Route 53 & CloudFront)
        working-directory: ./terraform/environments/global
        run: |
          terraform init -backend=false
          terraform validate

  terraform-primary:
    name: 'Terraform Plan & Apply - Primary (us-east-1)'
    needs: [validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform/environments/primary_us_east_1

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color

      - name: Terraform Apply
        run: terraform apply -auto-approve

  terraform-secondary:
    name: 'Terraform Plan & Apply - Secondary Warm Standby (us-west-2)'
    needs: [terraform-primary]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform/environments/secondary_us_west_2

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color

      - name: Terraform Apply
        run: terraform apply -auto-approve

  terraform-global:
    name: 'Terraform Plan & Apply - Global (Route 53 & CloudFront)'
    needs: [terraform-secondary]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform/environments/global

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color

      - name: Terraform Apply
        run: terraform apply -auto-approve
